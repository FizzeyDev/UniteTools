<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNITE Draft Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF8C00;
    --purple: #9B30FF;
    --blue-dark: #060D1F;
    --blue-mid: #0A1535;
    --blue-border: #1E3A7A;
    --cyan: #00D4FF;
    --text: #C8D8FF;
    --text-dim: #6A80B0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Exo 2', sans-serif;
    background: var(--blue-dark);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  body.overlay-mode #app { display: none; }

  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  #display-panel {
    flex: 0 0 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(160deg, #07112a 0%, #050c1e 100%);
    border-right: 1px solid var(--blue-border);
  }

  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--blue-border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .panel-header h2 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .glow-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: glowPulse 3s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes glowPulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  .display-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--blue-border) transparent;
  }

  .display-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .empty-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    gap: 10px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.5;
  }

  .display-slot {
    position: relative;
    border-radius: 8px;
    overflow: visible;
    cursor: pointer;
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    transition: transform 0.15s;
  }
  .display-slot:hover { transform: scale(1.05); }
  .display-slot:hover .remove-btn { opacity: 1; }

  .display-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    filter: grayscale(1) brightness(0.45);
  }

  .display-slot .team-ring {
    position: absolute;
    inset: -3px;
    border-radius: 11px;
    pointer-events: none;
    border: 3px solid transparent;
  }
  .display-slot.team-orange .team-ring {
    border-color: var(--orange);
    box-shadow: 0 0 12px rgba(255,140,0,0.8);
  }
  .display-slot.team-purple .team-ring {
    border-color: var(--purple);
    box-shadow: 0 0 12px rgba(155,48,255,0.8);
  }

  .display-slot .remove-btn {
    position: absolute;
    top: -6px; right: -6px;
    width: 20px; height: 20px;
    background: rgba(220,30,30,0.95);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.15s;
    color: white;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
  }

  .obs-bar {
    padding: 10px 12px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid var(--blue-border);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .obs-btn {
    padding: 6px 14px;
    background: linear-gradient(135deg, #1a3a6e, #0d2050);
    border: 1px solid var(--blue-border);
    border-radius: 6px; color: var(--cyan);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer;
    text-transform: uppercase; transition: all 0.2s;
  }
  .obs-btn:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,212,255,0.3); }

  .clear-btn {
    padding: 6px 12px;
    background: rgba(220,50,50,0.15);
    border: 1px solid rgba(220,50,50,0.4);
    border-radius: 6px; color: #FF6060;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer;
    text-transform: uppercase; transition: all 0.2s;
  }
  .clear-btn:hover { background: rgba(220,50,50,0.3); }

  #list-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--blue-mid);
    overflow: hidden;
  }

  .list-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--blue-border);
    flex-shrink: 0;
  }

  .list-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--purple); margin-bottom: 10px;
  }

  .search-bar { position: relative; }
  .search-bar input {
    width: 100%; padding: 8px 12px 8px 34px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--blue-border);
    border-radius: 6px; color: var(--text);
    font-family: 'Exo 2', sans-serif; font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--purple); }
  .search-bar input::placeholder { color: var(--text-dim); }
  .search-icon {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%); color: var(--text-dim); font-size: 13px;
  }

  .team-selector {
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--blue-border);
    flex-shrink: 0;
  }

  .team-selector-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .team-btn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
    border: 2px solid;
    transition: all 0.15s;
    text-transform: uppercase;
    text-align: center;
    opacity: 0.45;
  }
  .team-btn.orange { border-color: var(--orange); color: var(--orange); background: rgba(255,140,0,0.05); }
  .team-btn.orange.active { background: rgba(255,140,0,0.2); box-shadow: 0 0 16px rgba(255,140,0,0.5); opacity: 1; }
  .team-btn.purple { border-color: var(--purple); color: var(--purple); background: rgba(155,48,255,0.05); }
  .team-btn.purple.active { background: rgba(155,48,255,0.2); box-shadow: 0 0 16px rgba(155,48,255,0.5); opacity: 1; }
  .team-btn.none-btn { flex: 0 0 auto; border-color: #444; color: var(--text-dim); background: transparent; }
  .team-btn.none-btn.active { background: rgba(255,255,255,0.07); opacity: 1; }
  .team-btn:hover { opacity: 0.9; }

  .role-tabs {
    padding: 8px 16px 0;
    display: flex; gap: 6px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--blue-border);
    flex-wrap: wrap;
  }

  .role-tab {
    padding: 4px 10px 6px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; border-bottom: 2px solid transparent;
    color: var(--text-dim); transition: all 0.15s;
    white-space: nowrap;
  }
  .role-tab:hover { color: var(--text); }
  .role-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }

  .pokemon-grid-wrapper {
    flex: 1; overflow-y: auto;
    padding: 10px 12px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--blue-border) transparent;
  }

  .pokemon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 8px;
  }

  .pokemon-card {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
    filter: brightness(0.55) saturate(0.6);
  }
  .pokemon-card:hover {
    transform: translateY(-3px) scale(1.06);
    filter: brightness(1) saturate(1) !important;
    z-index: 5;
  }
  .pokemon-card.in-display {
    filter: brightness(0.28) saturate(0.15);
  }

  .pokemon-card img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    display: block; background: rgba(0,0,0,0.4);
  }

  .pokemon-card .card-name {
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 9px; font-weight: 600;
    color: var(--text-dim);
    padding: 3px 2px 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    background: rgba(0,0,0,0.5);
  }
  .pokemon-card:hover .card-name { color: var(--text); }

  .role-dot {
    position: absolute; top: 3px; left: 3px;
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.5); z-index: 2;
  }
  .role-dot.atk { background: #FF4D4D; }
  .role-dot.def { background: #4DA6FF; }
  .role-dot.sup { background: #4DFFB0; }
  .role-dot.spe { background: #FFD700; }
  .role-dot.all { background: #C060FF; }

  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,212,255,0.15);
    border: 1px solid var(--cyan); border-radius: 8px;
    padding: 8px 16px; font-size: 12px; color: var(--cyan);
    font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;
    opacity: 0; transition: all 0.3s; z-index: 10000;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .count-badge {
    background: rgba(0,212,255,0.15);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 10px; padding: 1px 7px;
    font-size: 10px; color: var(--cyan);
    font-family: 'Rajdhani', sans-serif; font-weight: 600;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 9999;
  }
</style>
</head>
<body>

<div id="app">
  <div id="display-panel">
    <div class="panel-header">
      <h2>🎮 Display Overlay</h2>
    </div>
    <div class="glow-line"></div>
    <div class="display-area">
      <div class="display-grid" id="displayGrid"></div>
    </div>
    <div class="obs-bar">
      <button class="obs-btn" onclick="openOverlay()">📺 OBS SOURCE</button>
      <button class="obs-btn" onclick="copyOverlayURL()">📋 COPIER URL</button>
      <button class="clear-btn" onclick="clearAll()">✕ VIDER</button>
    </div>
  </div>

  <div id="list-panel">
    <div class="list-header">
      <div class="list-title">Pokédex UNITE <span class="count-badge" id="countBadge">0</span></div>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Rechercher (EN / FR)..." oninput="renderList()">
      </div>
    </div>

    <div class="team-selector">
      <span class="team-selector-label">Team :</span>
      <button class="team-btn orange" id="btnOrange" onclick="setMode('orange')">🟠 Orange</button>
      <button class="team-btn purple" id="btnPurple" onclick="setMode('purple')">🟣 Violette</button>
      <button class="team-btn none-btn active" id="btnNone" onclick="setMode(null)">— Aucune</button>
    </div>

    <div class="role-tabs">
      <div class="role-tab active" onclick="setRole(this,'all')">Tous</div>
      <div class="role-tab" onclick="setRole(this,'atk')">⚔️ Attaque</div>
      <div class="role-tab" onclick="setRole(this,'def')">🛡️ Défense</div>
      <div class="role-tab" onclick="setRole(this,'sup')">💚 Support</div>
      <div class="role-tab" onclick="setRole(this,'spe')">⚡ Vitesse</div>
    </div>

    <div class="pokemon-grid-wrapper">
      <div class="pokemon-grid" id="pokemonGrid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const IMG_BASE = 'assets/pokemon/';
const LS_KEY = 'unite_tracker_picks';
let picks = []; // [{ file, team }]
let activeMode = null;
let roleFilter = 'all';

// ===== LOCALSTORAGE SYNC =====
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(picks)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) picks = JSON.parse(raw);
  } catch(e) { picks = []; }
}

// ===== MODE TEAM =====
function setMode(mode) {
  activeMode = mode;
  document.getElementById('btnOrange').classList.toggle('active', mode === 'orange');
  document.getElementById('btnPurple').classList.toggle('active', mode === 'purple');
  document.getElementById('btnNone').classList.toggle('active', mode === null);
}

// ===== CLIC POKÉMON =====
function onCardClick(file) {
  const idx = picks.findIndex(p => p.file === file);
  if (idx !== -1) picks.splice(idx, 1);
  else picks.push({ file, team: activeMode });
  saveState();
  renderDisplay();
  renderList();
}

function removePick(file) {
  picks = picks.filter(p => p.file !== file);
  saveState();
  renderDisplay();
  renderList();
}

function clearAll() {
  picks = [];
  saveState();
  renderDisplay();
  renderList();
}

// ===== RENDER DISPLAY =====
function renderDisplay() {
  const grid = document.getElementById('displayGrid');
  grid.innerHTML = '';

  if (picks.length === 0) {
    grid.innerHTML = `<div class="empty-display">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#C8D8FF" stroke-width="1.5"/>
        <line x1="2" y1="20" x2="38" y2="20" stroke="#C8D8FF" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="5" stroke="#C8D8FF" stroke-width="1.5" fill="#060D1F"/>
      </svg>
      <span>Sélectionnez une team puis</span>
      <span>cliquez sur un Pokémon</span>
    </div>`;
    return;
  }

  picks.forEach(({ file, team }) => {
    const poke = POKEMON_DATA.find(p => p.file === file);
    if (!poke) return;
    const slot = document.createElement('div');
    slot.className = 'display-slot' + (team ? ' team-' + team : '');
    slot.innerHTML = `
      <img src="${IMG_BASE}${file}" alt="${poke.name}" onerror="this.style.background='#0a1535'">
      <div class="team-ring"></div>
      <div class="remove-btn" onclick="removePick('${file}')">×</div>
    `;
    grid.appendChild(slot);
  });
}

// ===== RENDER LIST =====
function renderList() {
  const grid = document.getElementById('pokemonGrid');
  const search = document.getElementById('searchInput').value.toLowerCase();

  const filtered = POKEMON_DATA.filter(p => {
    const ms = !search || p.name.toLowerCase().includes(search) || p.name_fr.toLowerCase().includes(search);
    return ms && (roleFilter === 'all' || p.role === roleFilter);
  }).sort((a, b) => a.name.localeCompare(b.name));

  document.getElementById('countBadge').textContent = filtered.length;
  grid.innerHTML = '';

  filtered.forEach(poke => {
    const inDisplay = picks.some(p => p.file === poke.file);
    const card = document.createElement('div');
    card.className = 'pokemon-card' + (inDisplay ? ' in-display' : '');
    card.innerHTML = `
      <div class="role-dot ${poke.role}"></div>
      <img src="${IMG_BASE}${poke.file}" alt="${poke.name}" onerror="this.style.background='#0a1535';this.style.minHeight='60px'">
      <div class="card-name">${poke.name}</div>
    `;
    card.addEventListener('click', () => onCardClick(poke.file));
    grid.appendChild(card);
  });
}

function setRole(el, role) {
  roleFilter = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// ===== OBS =====
function openOverlay() {
  const url = window.location.href.split('?')[0] + '?overlay=true';
  window.open(url, '_blank', 'width=700,height=200,resizable=yes,scrollbars=no');
  showToast('Fenêtre overlay ouverte — ajoutez comme Browser Source dans OBS');
}

function copyOverlayURL() {
  const url = window.location.href.split('?')[0] + '?overlay=true';
  navigator.clipboard.writeText(url).then(() => showToast('URL copiée ! Collez dans OBS > Browser Source'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ===== OVERLAY MODE =====
// Le navigateur interne d'OBS a son propre localStorage isolé du vrai navigateur.
// Solution : l'overlay relit localStorage toutes les 500ms (polling).
function checkOverlayMode() {
  if (new URLSearchParams(window.location.search).get('overlay') !== 'true') return;

  document.body.classList.add('overlay-mode');
  document.body.style.background = 'transparent';

  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:transparent;align-content:flex-start;';
  document.body.appendChild(div);

  function render(data) {
    div.innerHTML = '';
    (data || []).forEach(({ file, team }) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:80px;height:80px;flex-shrink:0;';
      const img = document.createElement('img');
      img.src = IMG_BASE + file;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:8px;filter:grayscale(1) brightness(0.45);';
      const ring = document.createElement('div');
      let rs = 'position:absolute;inset:-3px;border-radius:11px;pointer-events:none;border:3px solid transparent;';
      if (team === 'orange') rs += 'border-color:#FF8C00;box-shadow:0 0 12px rgba(255,140,0,0.8);';
      else if (team === 'purple') rs += 'border-color:#9B30FF;box-shadow:0 0 12px rgba(155,48,255,0.8);';
      ring.style.cssText = rs;
      wrap.appendChild(img);
      wrap.appendChild(ring);
      div.appendChild(wrap);
    });
  }

  // Polling localStorage toutes les 500ms
  let lastRaw = null;
  setInterval(() => {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw !== lastRaw) {
        lastRaw = raw;
        render(raw ? JSON.parse(raw) : []);
      }
    } catch(e) {}
  }, 500);
}

// ===== INIT =====
loadState();
checkOverlayMode();
renderDisplay();
renderList();
</script>
</body>
