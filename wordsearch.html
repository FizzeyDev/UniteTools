<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang="wordsearch_page_title">Unite Tools - PokéSearch</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/wordsearch.css" />
  <link rel="stylesheet" href="css/theme.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B7HW29S7HW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-B7HW29S7HW');
  </script>
</head>
<body>

  <div id="navbar-container"></div>

  <!-- ── Floating sidebar toggle button ── -->
  <button class="ws-sidebar-toggle" id="ws-sidebar-toggle" aria-label="Classement">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
      <path d="M4 22h16"/>
      <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
      <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
    </svg>
    <span class="ws-sidebar-label" data-lang="wordsearch_leaderboard_title">Classement</span>
  </button>

  <!-- ── Sliding sidebar — Leaderboard only ── -->
  <aside class="ws-sidebar" id="ws-sidebar">
    <div class="ws-sidebar-inner">

      <!-- Leaderboard -->
      <div class="ws-sidebar-section">
        <div class="ws-sidebar-section-title">🏅 <span data-lang="wordsearch_leaderboard_title">Classement du jour</span></div>
        <div class="ws-leaderboard" id="ws-leaderboard-entries">
          <div class="ws-lb-loading" data-lang="wordsearch_loading">Chargement…</div>
        </div>
      </div>

    </div>
  </aside>

  <!-- ── Back button (flow, above header) ── -->
  <div class="ws-top-bar">
    <a href="unite-dle.html" class="ws-back-btn" data-lang="wordsearch_back">← Retour</a>
  </div>

  <div class="ws-header">
    <h1><span>Poké</span><span class="h1-accent">Search</span></h1>
  </div>

  <p class="ws-subtitle">Pokémon Unite · <span data-lang="wordsearch_daily">Édition quotidienne</span></p>

  <div class="ws-progress">
    <div class="ws-progress-label">
      <span data-lang="wordsearch_progress">Progression</span>
      <span><span id="ws-found">0</span> / <span id="ws-total">0</span></span>
    </div>
    <div class="ws-progress-bar-bg">
      <div class="ws-progress-bar" id="ws-bar"></div>
    </div>
  </div>

  <div class="ws-body">
    <div>
      <div class="ws-grid-wrap">
        <div class="ws-grid" id="ws-grid"></div>
        <canvas class="ws-overlay" id="ws-canvas"></canvas>
      </div>
    </div>

    <!-- Panel latéral droit -->
    <div class="ws-panel">

      <!-- Timer -->
      <div class="ws-panel-block ws-timer-block" id="ws-timer-block">
        <div class="ws-timer-inner">
          <div class="ws-timer-label">⏱ <span data-lang="wordsearch_timer_title">Timer</span></div>
          <div class="ws-timer-display" id="ws-timer">00:00</div>
          <div class="ws-daily-info">
            <span class="ws-daily-badge">Daily</span>
            <span id="ws-date-label"></span>
          </div>
        </div>
      </div>

      <!-- Liste de mots -->
      <div class="ws-panel-block">
        <div class="ws-panel-title" data-lang="wordsearch_find">Pokémon à trouver</div>
        <div class="ws-word-list" id="ws-word-list"></div>
      </div>

      <!-- Win panel -->
      <div class="ws-win" id="ws-win">
        <div class="ws-win-icon">🏆</div>
        <div class="ws-win-title" data-lang="wordsearch_win">Félicitations !</div>
        <div class="ws-win-sub" data-lang="wordsearch_win_sub">Tu as trouvé tous les Pokémon du jour !</div>

        <div class="ws-win-final-row">
          <span class="ws-win-time-label" data-lang="wordsearch_your_time">Ton temps :</span>
          <span class="ws-win-time-value" id="ws-final-time">--:--</span>
        </div>

        <div class="ws-submit-form" id="ws-submit-form">
          <p class="ws-submit-label" data-lang="wordsearch_submit_label">Inscris-toi au classement !</p>
          <div class="ws-submit-row">
            <input
              class="ws-pseudo-input"
              id="ws-pseudo-input"
              type="text"
              placeholder="Ton pseudo…"
              data-lang-placeholder="wordsearch_pseudo_placeholder"
              maxlength="20"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="ws-submit-btn" id="ws-submit-btn" data-lang="wordsearch_submit_btn">OK</button>
          </div>
        </div>

        <div class="ws-next-label" data-lang="wordsearch_next_label">Prochaine grille dans</div>
        <div class="ws-countdown" id="ws-countdown">--:--:--</div>
      </div>

    </div>
  </div>

  <script src="scripts/navbar.js"></script>
  <script src="scripts/wordsearch/wordsearch-data.js"></script>
  <script src="scripts/wordsearch/wordsearch-grid.js"></script>
  <script src="scripts/wordsearch/wordsearch.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
