<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-lang="map_page_title">Unite Tools - Interactive Map</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/navbar.css">
  <link rel="stylesheet" href="./css/map.css">
  <link rel="stylesheet" href="css/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div>

  <!-- ── Top Bar ── -->
  <div class="topbar">
    <span class="topbar-title" data-lang="map_topbar_title">🗺 Map</span>
    <div class="topbar-sep"></div>

    <!-- Map switch -->
    <div class="map-pills">
      <button class="map-pill active" data-map="groudon" data-lang="map_name_groudon">Groudon</button>
      <button class="map-pill" data-map="kyogre" data-lang="map_name_kyogre">Kyogre</button>
      <button class="map-pill" data-map="rayquaza" data-lang="map_name_rayquaza">Rayquaza</button>
    </div>

    <div class="topbar-sep"></div>

    <!-- Team toggle -->
    <div class="team-toggle">
      <button class="team-btn purple active" data-team="purple" data-lang="stream_team_purple_btn">🟣 Purple</button>
      <button class="team-btn orange"        data-team="orange" data-lang="stream_team_orange_btn">🟠 Orange</button>
    </div>

    <div class="topbar-sep"></div>

    <!-- Draw tools -->
    <div class="tool-group">
      <button class="tool-btn" data-tool="cursor" data-lang-title="map_tool_cursor_title" title="Select / Move" style="font-size:14px;">↖</button>
      <button class="tool-btn active" data-tool="draw" data-lang-title="map_tool_draw_title" title="Freehand (D)">✏</button>
      <button class="tool-btn"        data-tool="arrow" data-lang-title="map_tool_arrow_title" title="Arrow">➜</button>
      <button class="tool-btn"        data-tool="shape" data-lang-title="map_tool_shape_title" title="Shapes">⬡</button>
      <button class="tool-btn"        data-tool="eraser" data-lang-title="map_tool_eraser_title" title="Eraser (E)">⌫</button>
    </div>

    <!-- Shape type selector (shown only when shape tool active) -->
    <div class="shape-options" id="shape-options" style="display:none;">
      <button class="shape-type-btn active" data-shape="circle" data-lang-title="map_shape_circle_title" title="Circle">⬤</button>
      <button class="shape-type-btn"        data-shape="square" data-lang-title="map_shape_square_title" title="Rectangle">▬</button>
      <button class="shape-type-btn"        data-shape="triangle" data-lang-title="map_shape_triangle_title" title="Triangle">▲</button>
      <button class="shape-type-btn"        data-shape="diamond" data-lang-title="map_shape_diamond_title" title="Diamond">◆</button>
      <button class="shape-type-btn"        data-shape="line" data-lang-title="map_shape_line_title" title="Line">╱</button>
    </div>

    <!-- Colors -->
    <div class="color-row">
      <div class="color-swatch active" style="background:#4fc3f7;" data-color="#4fc3f7"></div>
      <div class="color-swatch"        style="background:#ef5350;" data-color="#ef5350"></div>
      <div class="color-swatch"        style="background:#ffd740;" data-color="#ffd740"></div>
      <div class="color-swatch"        style="background:#4caf82;" data-color="#4caf82"></div>
      <div class="color-swatch"        style="background:#9f53ec;" data-color="#9f53ec"></div>
      <div class="color-swatch"        style="background:#ff9d00;" data-color="#ff9d00"></div>
      <div class="color-swatch"        style="background:#ffffff;" data-color="#ffffff"></div>
    </div>

    <!-- Stroke size -->
    <select class="stroke-select" id="stroke-size">
      <option value="2" data-lang="map_stroke_thin">Thin</option>
      <option value="4" selected data-lang="map_stroke_medium">Medium</option>
      <option value="7" data-lang="map_stroke_thick">Thick</option>
      <option value="12" data-lang="map_stroke_bold">Bold</option>
    </select>

    <div class="topbar-sep"></div>

    <!-- Actions -->
    <button class="action-btn" id="undo-btn" data-lang-title="map_undo_title" title="Undo (Ctrl+Z)" data-lang="map_undo_btn">↩ Undo</button>
    <button class="action-btn danger" id="clear-draw-btn" data-lang="map_clear_btn">🗑 Clear</button>

    <div class="topbar-spacer"></div>

    <!-- Pan hint -->
    <span style="font-size:0.7rem;color:var(--text-dim);white-space:nowrap;" data-lang="map_pan_hint">
      🖱 Wheel = zoom &nbsp;|&nbsp; Space+drag = pan
    </span>
  </div>

  <!-- ── Main ── -->
  <div class="main-layout">

    <!-- Icon Sidebar -->
    <div class="icon-sidebar">
      <button class="sidebar-cat-btn active" data-cat="pokemon">
        <span class="cat-icon">🎮</span><span data-lang="map_cat_pokemon">Pokémon</span>
      </button>
      <button class="sidebar-cat-btn" data-cat="neutrals">
        <span class="cat-icon">🌿</span><span data-lang="map_cat_wilds">Wilds</span>
      </button>
      <button class="sidebar-cat-btn" data-cat="items">
        <span class="cat-icon">🎒</span><span data-lang="items">Items</span>
      </button>
      <button class="sidebar-cat-btn" data-cat="other">
        <span class="cat-icon">⚙</span><span data-lang="nav_other_title">Other</span>
      </button>
      <div class="sidebar-div"></div>
      <button class="sidebar-cat-btn" id="show-names-btn" data-lang-title="map_names_title" title="Toggle names">
        <span class="cat-icon" id="names-icon">🏷</span><span data-lang="map_names_btn">Names</span>
      </button>
      <button class="sidebar-cat-btn" id="duel-mode-btn" data-lang-title="map_duel_title" title="1v1 — Open in Damage Calc">
        <span class="cat-icon">⚔</span><span data-lang="map_duel_btn">1v1</span>
      </button>
    </div>

    <!-- Entity Panel -->
    <div class="entity-panel" id="entity-panel">
      <div class="panel-search-wrap">
        <div class="search-wrap-inner">
          <span class="search-icon-panel">🔍</span>
          <input type="text" class="panel-search" id="panel-search"
                 placeholder="Search..." data-lang-placeholder="map_search_placeholder" autocomplete="off">
        </div>
      </div>
      <div class="role-filters" id="role-filters">
        <button class="role-filter active" data-role="all-roles" data-lang="tierlist_filter_all">All</button>
        <button class="role-filter" data-role="atk" data-lang="tierlist_filter_atk">Attacker</button>
        <button class="role-filter" data-role="def" data-lang="tierlist_filter_def">Defender</button>
        <button class="role-filter" data-role="spe" data-lang="tierlist_filter_spe">Speedster</button>
        <button class="role-filter" data-role="sup" data-lang="tierlist_filter_sup">Supporter</button>
        <button class="role-filter" data-role="all" data-lang="tierlist_filter_allround">All-Rounder</button>
      </div>
      <div class="role-filters" id="item-filters" style="display:none;">
        <button class="item-filter role-filter active" data-item-type="all" data-lang="tierlist_filter_all">All</button>
        <button class="item-filter role-filter" data-item-type="held" data-lang="map_filter_held">Held</button>
        <button class="item-filter role-filter" data-item-type="battle" data-lang="map_filter_battle">Battle</button>
      </div>
      <div class="panel-grid-wrap" id="panel-grid-wrap">
        <div id="sprite-grid-container"></div>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-area" id="canvas-area">

      <!-- Viewport: this element is panned & zoomed via CSS transform -->
      <div id="viewport">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <!-- draggable="false" prevents browser native image drag -->
          <img id="map-img"
               src="assets/maps/map_groudon.webp"
               alt="Map"
               draggable="false"
               onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAwIiBoZWlnaHQ9IjYwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMWEyYTJiIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzZhODU4NyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk1hcCBJbWFnZSBOb3QgRm91bmQ8L3RleHQ+PC9zdmc+'">
          <canvas id="draw-canvas"></canvas>
          <div id="sprites-layer"></div>
        </div>
      </div>

      <!-- Zoom controls -->
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <div class="zoom-level" id="zoom-label">100%</div>
        <button class="zoom-btn" id="zoom-out">−</button>
        <button class="zoom-btn" id="zoom-reset"
                style="font-size:11px;font-family:'Rajdhani',sans-serif;font-weight:700;">FIT</button>
      </div>
    </div>

    <!-- Right Panel (selected sprite info) -->
    <div class="right-panel" id="right-panel">
      <div class="right-panel-inner">
        <div class="rp-title" data-lang="map_rp_selected">Selected</div>
        <div class="rp-sprite-preview" id="rp-preview">
          <img src="" id="rp-img" alt="" draggable="false">
          <span class="rp-sprite-name" id="rp-name">—</span>
        </div>
        <div>
          <div class="rp-label" data-lang="map_rp_team">Team</div>
          <div class="rp-team-btns">
            <button class="rp-team-btn purple active" data-rp-team="purple">🟣</button>
            <button class="rp-team-btn orange"        data-rp-team="orange">🟠</button>
            <button class="rp-team-btn neutral"       data-rp-team="neutral">⚪</button>
          </div>
        </div>
        <div>
          <div class="rp-label" data-lang="map_rp_size">Size</div>
          <div class="rp-size-wrap">
            <input type="range" class="rp-size-slider" id="rp-size" min="24" max="96" value="48">
            <span class="rp-size-val" id="rp-size-val">48</span>
          </div>
        </div>
        <button class="rp-delete-btn" id="rp-delete" data-lang="map_rp_remove">🗑 Remove</button>
      </div>
    </div>
  </div>

  <!-- Drag ghost -->
  <div class="drag-ghost" id="drag-ghost">
    <img id="drag-ghost-img" src="" alt="" draggable="false">
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts: order matters — data.js first, then app.js (defines App), then modules -->
  <script src="./scripts/map/data.js"></script>
  <script src="./scripts/map/app.js"></script>
  <script src="./scripts/map/viewport.js"></script>
  <script src="./scripts/map/drawing.js"></script>
  <script src="./scripts/map/sprites.js"></script>
  <script src="./scripts/map/panel.js"></script>
  <script src="./scripts/navbar.js"></script>
  <script type="module">
    import { hydrateDraftSprites } from "./scripts/drafts/map_draft.js";
    setTimeout(hydrateDraftSprites, 0);
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    document.querySelectorAll('.shape-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.shape-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        App.setCurrentShape && App.setCurrentShape(btn.dataset.shape);
      });
    });
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('duel-mode-btn').addEventListener('click', () => {
        if (App.startDuel) App.startDuel();
      });
    });
  </script>
</body>
</html>
